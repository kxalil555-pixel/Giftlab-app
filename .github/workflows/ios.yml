name: iOS IPA (unsigned, ESign uchun)

on:
  push: { branches: [main, master] }
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (imzosiz)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild build -project GiftLab.xcodeproj -scheme GiftLab -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath $RUNNER_TEMP/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find $RUNNER_TEMP/dd/Build/Products -maxdepth 2 -name "GiftLab.app" | head -1)
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          mkdir -p build && zip -qry build/GiftLab.ipa Payload
          ls -la build

      - uses: actions/upload-artifact@v4
        with: { name: GiftLab-ipa, path: build/GiftLab.ipa }
